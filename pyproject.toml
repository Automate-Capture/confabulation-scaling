[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confabulation-scaling"
version = "0.1.0"
description = "Predict LLM factual recall errors via scaling laws"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Young", email = "research@automate-capture.com" },
]
keywords = ["large language models", "confabulation", "scaling laws", "factual recall", "sigmoid calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/Automate-Capture/confabulation-scaling"
Documentation = "https://automate-capture.github.io/confabulation-scaling/"
Repository = "https://github.com/Automate-Capture/confabulation-scaling"
Issues = "https://github.com/Automate-Capture/confabulation-scaling/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
